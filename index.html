<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Little Letter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="glow"></div>

  <div class="garden" aria-hidden="true">
    <div class="flower tl"></div>
    <div class="flower tr"></div>
    <div class="flower bl"></div>
    <div class="flower br"></div>
  </div>

  <div class="petals" aria-hidden="true">
    <i class="petal"></i><i class="petal"></i><i class="petal"></i>
    <i class="petal"></i><i class="petal"></i><i class="petal"></i>
    <i class="petal"></i><i class="petal"></i><i class="petal"></i>
    <i class="petal"></i>
  </div>

  <main class="scene">
    <section class="content">

      <h1 class="title">A Little Something For You</h1>
      <p class="subtitle">There is a letter waiting inside...</p>

      <div class="envelope-wrap">
        <div class="envelope" id="envelope">

          <div class="letter">
            <h2>Dear You,</h2>
            <p>
              This is where your letter will appear.
              We will add the real letter in the next step.
            </p>
          </div>

          <div class="envelope-body">
            <div class="fold-left"></div>
            <div class="fold-right"></div>
          </div>

          <div class="flap"></div>

          <div class="seal" aria-hidden="true">♥</div>

          <div class="sparkles" aria-hidden="true">
            <i class="sparkle"></i>
            <i class="sparkle"></i>
            <i class="sparkle"></i>
            <i class="sparkle"></i>
          </div>

        </div>
      </div>

      <button class="open-btn" id="openBtn" type="button">
        <span>OPEN</span>
      </button>

    </section>
    <footer class="site-footer">

  <p>
    © 2026
    <a
      href="YOUR_PAGE_LINK"
      target="_blank"
      rel="noopener noreferrer"
    >
      Nexora Tech
    </a>
    — All Rights Reserved.
  </p>

</footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
